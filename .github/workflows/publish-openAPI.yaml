name: Publish OpenAPI JSON

on:
  workflow_dispatch:

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout apis repo
        uses: actions/checkout@v4
        with:
          path: apis

      - name: Checkout registry-gen2 (core)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openg2p-registry-gen2
          path: openg2p-registry-gen2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout registry-gen2-extensions
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openg2p-registry-gen2-extensions
          path: openg2p-registry-gen2-extensions
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and APIs
        run: |
          pip install -e openg2p-registry-gen2/openg2p-registry-core
          pip install -e openg2p-registry-gen2-extensions/openg2p-registry-farmer-extension
          pip install -e apis/openg2p-registry-bene-portal-api
          pip install -e apis/openg2p-registry-staff-portal-api
          pip install -e apis/openg2p-registry-partner-api
        working-directory: ${{ github.workspace }}

      - name: Generate OpenAPI JSON files
        run: python apis/scripts/generate_openapi.py apis/docs/openapi
        working-directory: ${{ github.workspace }}

      - name: Commit and push docs/openapi
        run: |
          cd apis
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/openapi/
          if ! git diff --staged --quiet; then
            git commit -m "chore: publish OpenAPI JSON for bene-portal, staff-portal, partner APIs"
            git push "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:${{ github.ref_name }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
